<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Shock Stars: ICU clinical-reasoning game prototype (draft, fictional patient, playtest build).">
<title>Shock Stars - septic shock playtest (draft)</title>
<style>:root {
  color-scheme: light dark;
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eef2f5; --ink: #1f2933; --ink-2: #4b5966; --line: #d6dee6;
  --accent: #005f73; --accent-2: #0a7f99; --accent-ink: #ffffff; --accent-soft: #dff0f3;
  --good: #05603a; --good-soft: #dff5e9; --ok: #1849a9; --ok-soft: #e4ecfc; --warn: #93370d; --warn-soft: #fdeedd; --bad: #a11a12; --bad-soft: #fde6e4;
  --mon-bg: #0c1e28; --mon-tile: #13303d; --mon-ink: #eaf7f9; --mon-dim: #9fc2cb; --mon-alert: #ffb4ad; --mon-alert-bg: #4a1714;
  --radius: 14px; --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 2px 6px rgba(16, 24, 40, 0.08);
  --focus: #f0b000;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e151b; --surface: #151f27; --surface-2: #1c2832; --ink: #e8eef2; --ink-2: #a9b7c2; --line: #2b3a46;
    --accent: #4fc3d6; --accent-2: #7fd6e4; --accent-ink: #062027; --accent-soft: #123640;
    --good: #7ad9a6; --good-soft: #12301f; --ok: #9db9ff; --ok-soft: #1a2747; --warn: #f7b27a; --warn-soft: #3a2412; --bad: #ff9c94; --bad-soft: #3d1715;
    --mon-bg: #061118; --mon-tile: #0f2530; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.5; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
h1, h2, h3 { line-height: 1.25; margin-block: 0 0.5rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
.h3 { font-size: 1.1rem; margin-block-start: 1.1rem; }
.h4 { font-size: 1rem; margin-block: 1rem 0.4rem; }
p { margin-block: 0 0.75rem; }
.lead { font-size: 1.08rem; }
.muted { color: var(--ink-2); }
.small { font-size: 0.9rem; }
.tiny { font-size: 0.8rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-block-end: 0.35rem; }

.topbar { position: sticky; inset-block-start: 0; z-index: 5; display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 0.5rem;
  padding: 0.6rem 1rem; padding-inline: max(1rem, env(safe-area-inset-left)); background: var(--accent); color: var(--accent-ink); }
.brand { display: flex; align-items: center; gap: 0.45rem; min-inline-size: 0; }
.brand .icon { inline-size: 1.4rem; block-size: 1.4rem; fill: currentColor; }
.brand-name { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.01em; }
.brand-sub { font-size: 0.85rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 0.4rem; flex-wrap: nowrap; justify-content: flex-end; flex: none; }
@media (max-width: 760px) { .brand-sub { display: none; } }
@media (max-width: 560px) {
  .topbar { padding-block: 0.45rem; }
  .brand-name { font-size: 1rem; }
  .btn-label { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .topbar .btn { min-inline-size: 2.4rem; padding-inline: 0.5rem; }
  .draft-banner { font-size: 0.75rem; padding-block: 0.25rem; }
}
.clock { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0.2rem 0.55rem;
  border-radius: 999px; background: color-mix(in srgb, var(--accent-ink) 18%, transparent); }
.clock .icon { inline-size: 1rem; block-size: 1rem; fill: currentColor; }
.draft-banner { margin: 0; padding: 0.35rem 1rem; text-align: center; font-size: 0.82rem; background: var(--warn-soft); color: var(--warn); border-block-end: 1px solid var(--line); }

.shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; max-inline-size: 1200px; margin-inline: auto; padding: 1rem; padding-block-end: 6rem; }
.with-panel .shell { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .with-panel .shell { grid-template-columns: minmax(0, 1fr) 340px; } }
.main { display: flex; flex-direction: column; gap: 1rem; min-inline-size: 0; outline: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.15rem; box-shadow: var(--shadow); }
.card.subtle { background: var(--surface-2); box-shadow: none; }
.hero h1 { font-size: 1.9rem; }
.facts { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0; margin: 0 0 1rem; list-style: none; }
.facts li { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.9rem; font-weight: 600; }
ul.plain { padding-inline-start: 1.1rem; margin: 0 0 0.5rem; }
.findings-list li { margin-block-end: 0.3rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-block-size: 2.9rem; padding: 0.55rem 1.1rem;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 650; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); }
.btn-small { min-block-size: 2.2rem; padding: 0.3rem 0.7rem; font-size: 0.85rem; }
.topbar .btn { background: transparent; color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent-ink) 45%, transparent); }
.topbar .btn-on { background: var(--accent-ink); color: var(--accent); }
.btn .icon { inline-size: 1.05rem; block-size: 1.05rem; fill: currentColor; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-block-start: 1rem; }
.check { display: flex; gap: 0.6rem; align-items: flex-start; margin-block-start: 1rem; cursor: pointer; }
.check input { inline-size: 1.2rem; block-size: 1.2rem; margin-block-start: 0.15rem; accent-color: var(--accent); }
.notice { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 0.6rem 0.8rem; display: flex; gap: 0.5rem; align-items: flex-start; }
.notice-alert { background: var(--bad-soft); color: var(--bad); }
.notice .icon { inline-size: 1.2rem; block-size: 1.2rem; fill: currentColor; flex: none; margin-block-start: 0.1rem; }

/* monitor */
.main { container: main / inline-size; }
.decision-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
@container main (min-width: 980px) {
  .decision-layout { grid-template-columns: minmax(0, 23rem) minmax(0, 1fr); }
  .decision-layout .monitor { position: sticky; inset-block-start: 4.6rem; }
}
.monitor { container: monitor / inline-size; background: var(--mon-bg); color: var(--mon-ink); border-radius: var(--radius); padding: 0.8rem; display: flex; flex-direction: column; gap: 0.7rem; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; }
@container monitor (min-width: 620px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile { background: var(--mon-tile); border-radius: 10px; padding: 0.5rem 0.6rem; display: flex; flex-direction: column; min-inline-size: 0; }
@container monitor (max-width: 619px) { .tile-sub.generic { display: none; } .tile-value { font-size: 1.6rem; } }
.tile-label { font-size: 0.78rem; color: var(--mon-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.tile-value { font-size: 2rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile-sub { font-size: 0.8rem; color: var(--mon-dim); overflow-wrap: anywhere; }
.tile-alert { background: var(--mon-alert-bg); }
.tile-alert .tile-value { color: var(--mon-alert); }
.tile-flag { display: inline-flex; align-items: center; gap: 0.15rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--mon-alert); }
.tile-flag .icon { inline-size: 0.9rem; block-size: 0.9rem; fill: currentColor; }
.monitor-row { border-block-start: 1px solid color-mix(in srgb, var(--mon-dim) 25%, transparent); padding-block-start: 0.6rem; }
.row-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mon-dim); margin-block-end: 0.35rem; font-weight: 700; }
.perf { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.35rem 1rem; margin: 0; font-size: 0.95rem; }
.perf-item dt { font-size: 0.78rem; color: var(--mon-dim); }
.perf-item dd { margin: 0; font-weight: 600; }
.perf-item.stale dd { font-weight: 400; color: var(--mon-dim); }
.monitor .when { color: var(--mon-dim); font-size: 0.85em; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; margin: 0; padding: 0; }
.chip { background: var(--mon-tile); border: 1px solid color-mix(in srgb, var(--mon-dim) 35%, transparent); border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.88rem; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.92rem; }
.monitor .muted, .pending { color: var(--mon-dim); margin: 0; font-size: 0.9rem; }

/* decision */
.prompt { font-size: 1.2rem; font-weight: 650; }
.hint { color: var(--ink-2); font-size: 0.92rem; }
.options { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.55rem; min-inline-size: 0; }
.option { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 0.9rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-block-size: 3.4rem; }
.option:hover { border-color: var(--accent); }
.option.is-checked { border-color: var(--accent); background: var(--accent-soft); }
.option input { inline-size: 1.3rem; block-size: 1.3rem; flex: none; accent-color: var(--accent); margin: 0; }
.option-body { display: flex; flex-direction: column; gap: 0.1rem; flex: 1; min-inline-size: 0; }
.option-label { font-weight: 600; }
.option-meta { font-size: 0.85rem; color: var(--ink-2); }
.key { display: none; }
@media (hover: hover) and (pointer: fine) {
  .key { display: inline-flex; align-items: center; justify-content: center; inline-size: 1.35rem; block-size: 1.35rem; margin-inline-end: 0.45rem; border-radius: 5px;
    border: 1px solid var(--line); font-size: 0.75rem; color: var(--ink-2); vertical-align: 0.1em; }
}
.sticky { position: sticky; inset-block-end: 0; background: var(--surface); padding-block: 0.75rem; margin-block-end: -0.5rem; border-block-start: 1px solid var(--line); }

/* outcome, end, debrief */
.timeline-chip { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--surface-2); border-radius: 999px; padding: 0.15rem 0.7rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.timeline-chip .icon { inline-size: 1rem; block-size: 1rem; fill: currentColor; }
.followups { list-style: none; padding: 0; margin: 0.5rem 0; display: flex; flex-direction: column; gap: 0.7rem; }
.followups li { display: flex; flex-direction: column; gap: 0.15rem; border-inline-start: 4px solid var(--accent); padding-inline-start: 0.75rem; }
.deltas { list-style: none; padding: 0; margin: 0 0 0.75rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; }
.delta { background: var(--surface-2); border-radius: 10px; padding: 0.5rem 0.7rem; display: flex; flex-direction: column; gap: 0.1rem; position: relative; font-variant-numeric: tabular-nums; }
.delta-label { font-size: 0.8rem; color: var(--ink-2); }
.delta .icon { position: absolute; inset-inline-end: 0.5rem; inset-block-start: 0.5rem; inline-size: 1.1rem; block-size: 1.1rem; fill: var(--ink-2); }
.end { border-inline-start-width: 6px; }
.tone-border-good { border-inline-start-color: var(--good); }
.tone-border-warn { border-inline-start-color: var(--warn); }
.tone-border-bad { border-inline-start-color: var(--bad); }
.badge { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.78rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.tone-good { background: var(--good-soft); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.tone-ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.tone-warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.tone-bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.ratings { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.6rem; }
.rating { border: 1px solid var(--line); border-radius: 12px; padding: 0.65rem 0.8rem; display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.5rem; align-items: center; }
.rating-name { font-weight: 650; }
.rating-help { grid-column: 1 / -1; }
.timers { inline-size: 100%; border-collapse: collapse; }
.timers th, .timers td { text-align: start; padding: 0.5rem 0.4rem; border-block-end: 1px solid var(--line); vertical-align: top; }
.timers thead th { font-size: 0.8rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.points { list-style: none; padding: 0; margin: 0 0 0.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
.point { display: grid; grid-template-columns: 9.5rem 1fr; gap: 0.6rem; align-items: start; }
.point p { margin: 0.2rem 0 0; }
@media (max-width: 520px) { .point { grid-template-columns: 1fr; gap: 0.25rem; } .point .badge { justify-self: start; } }
.timeline { padding-inline-start: 1.3rem; margin: 0; display: flex; flex-direction: column; gap: 0.35rem; }
.when { color: var(--ink-2); font-size: 0.88em; font-variant-numeric: tabular-nums; }

/* playtest panel */
.panel { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 0.9rem; align-self: start; font-size: 0.93rem; }
@media (min-width: 1000px) { .panel { position: sticky; inset-block-start: 4.2rem; max-block-size: calc(100vh - 5rem); overflow: auto; } }
.panel[hidden] { display: none; }
.bars { display: flex; flex-direction: column; gap: 0.45rem; margin-block: 0.5rem; }
.bar-row { display: grid; grid-template-columns: 1fr 5.5rem 1.6rem; gap: 0.5rem; align-items: center; }
.bar-label { font-size: 0.85rem; line-height: 1.2; }
.bar { block-size: 0.55rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar-fill { display: block; block-size: 100%; background: var(--accent); }
.bar-value { text-align: end; font-variant-numeric: tabular-nums; font-weight: 700; }
.panel details { border-block-start: 1px solid var(--line); padding-block: 0.4rem; }
.panel summary { cursor: pointer; font-weight: 650; }
.playtest-box { border: 1px dashed var(--accent); border-radius: 10px; padding: 0.6rem 0.8rem; margin-block: 0.75rem; background: var(--surface-2); }
.playtest-box summary { font-weight: 650; cursor: pointer; }

@media (prefers-reduced-motion: no-preference) { .option, .btn { transition: border-color 0.15s, background-color 0.15s; } }
@media print { .topbar, .panel, .actions { display: none !important; } body { background: #fff; } }
</style>
</head>

e proning in v0.1.","Antibiotic agents are not named (local-context decision pending).","All references are marked verification required; content is not approved for learner use."]},patient:{name:"Mr. Hale (fictional patient)",age:58,sex:"male",weightKg:80,history:"Type 2 diabetes (diet-controlled) and hypertension; former smoker. No heart or kidney disease, no recent hospital stays or antibiotic courses, no known drug allergies.",story:"Three days of productive cough, fevers and rigors; increasingly breathless today and newly confused, according to his wife, who is at the bedside and confirms he would want full treatment.",setting:"Emergency department resuscitation bay. You are the ICU resident asked to lead his resuscitation while an ICU bed is prepared. Two large-bore IVs are in place; nothing else has been started.",presentation:["BP 80/44 mm Hg (MAP 56), HR 124 (sinus tachycardia), RR 30, SpO2 89% on 4 L/min nasal cannula, temperature 39.1 °C","Confused, oriented to person only","Capillary refill 5 seconds; mottling over both knees","Right lower lobe crackles with bronchial breath sounds","Portable chest X-ray: right lower lobe consolidation with a right pleural effusion","No urine passed for about 8 hours; no laboratory results yet"]},learningObjectives:["Recognize septic shock and act first on the time-critical priorities: antibiotics, IV fluid (30 mL/kg) and circulatory support.","Escalate to a vasopressor when hypotension persists during or after initial fluid, without unnecessary delay.","Reassess deliberately (perfusion markers, dynamic tests) before repeating a treatment.","Recognize respiratory deterioration, weigh fluid against oxygenation, and escalate respiratory support safely (resuscitate before intubating).","Complete a safe disposition and source-evaluation plan."],stateModel:{hiddenVariables:[{id:"volume",label:"Effective circulating volume",scale:"0 severely depleted (a deficit of about 2.5 L, roughly 30 mL/kg) / 5 adequately filled / 10 overloaded; one step is about 500 mL",start:0,drives:"Fluid responsiveness (responsive at 3 or below); each full litre of deficit adds 1 to shock severity; IVC appearance"},{id:"vasodilation",label:"Vasodilation severity",scale:"0 normal vascular tone / 10 refractory vasoplegia",start:5,drives:"Main driver of hypotension and of vasopressor requirement"},{id:"cardiac",label:"Cardiac performance",scale:"0 severely depressed / 10 normal",start:7,drives:"Adds to shock severity when below 5; echo findings; falls during prolonged severe shock"},{id:"lungFluid",label:"Pulmonary fluid burden",scale:"0 clear / 10 severe alveolar filling (pneumonia exudate, capillary leak and resuscitation fluid)",start:6,drives:"SpO2, respiratory rate, work of breathing, lung ultrasound B-lines"},{id:"infection",label:"Infection control",scale:"0 uncontrolled and progressing / 10 controlled",start:2,drives:"Drives progression of vasodilation, capillary leak and pneumonia"}],derivedValues:[{id:"shock",label:"Shock severity",description:"Shock severity = vasodilation + volume-deficit term + (5 - cardiac performance, if below 5) - vasopressor support + temporary effects, kept between 0 and 10. The volume-deficit term is 1 point for each full litre still missing: (5 - volume) / 2, rounded down (2 at arrival, 1 after the first 1,200 mL, 0 once volume reaches 4). Vasopressor support: norepinephrine low dose 2, moderate 3, high 4; vasopressin adds 1."},{id:"perfusion",label:"Perfusion severity",description:"Perfusion severity = shock severity + 1 while norepinephrine runs at high dose (maximum 10). High-dose vasopressors raise the pressure, but gut, digital and microcirculatory ischemia mean perfusion does not improve in step, so capillary refill, mottling, urine output and lactate stay one step worse than the blood pressure suggests. Vasopressin carries no such cost in this draft."},{id:"oxygenDeficit",label:"Oxygen deficit",description:"Pulmonary fluid burden minus oxygen-support credit (nasal cannula
